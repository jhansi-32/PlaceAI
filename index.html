<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlaceAI — Placement Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0e1a;
  --bg2: #0e1422;
  --surface: #111827;
  --surface2: #1a2235;
  --surface3: #222d42;
  --border: #1e2d45;
  --border2: #263450;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.12);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.1);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.1);
  --purple: #8b5cf6;
  --purple-dim: rgba(139,92,246,0.12);
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #475569;
  --font: 'Plus Jakarta Sans', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;font-size:14px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* AUTH */
#authScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(ellipse 60% 40% at 20% 50%,rgba(59,130,246,0.06) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 80% 30%,rgba(139,92,246,0.05) 0%,transparent 70%)}
.auth-wrap{display:flex;width:100%;max-width:900px;min-height:540px;border-radius:20px;overflow:hidden;border:1px solid var(--border2);box-shadow:0 40px 80px rgba(0,0,0,0.6)}
.auth-left{flex:1;background:linear-gradient(135deg,#0f1d35 0%,#0d1829 100%);padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--border2);position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.15),transparent 70%)}
.auth-brand{display:flex;align-items:center;gap:10px}
.auth-brand-icon{width:36px;height:36px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px}
.auth-brand-name{font-size:1.1rem;font-weight:800;letter-spacing:-0.02em}
.auth-brand-name span{color:var(--blue)}
.auth-left h2{font-size:1.7rem;font-weight:800;line-height:1.25;letter-spacing:-0.03em;color:#fff;margin-top:36px}
.auth-left h2 span{color:var(--blue)}
.auth-left p{font-size:.82rem;color:var(--text2);line-height:1.7;margin-top:12px}
.auth-features{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.auth-feat{display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--text2)}
.af-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0}
.auth-footer{font-size:.65rem;color:var(--text3)}
.auth-right{width:400px;background:var(--surface);padding:48px 40px;display:flex;flex-direction:column;justify-content:center}
.auth-title{font-size:1.2rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.auth-sub{font-size:.75rem;color:var(--text2);margin-bottom:28px}
.auth-tabs{display:flex;background:var(--bg2);border-radius:8px;padding:3px;margin-bottom:24px;border:1px solid var(--border)}
.auth-tab{flex:1;padding:8px;background:transparent;border:none;color:var(--text2);font-family:var(--font);font-weight:600;font-size:.75rem;cursor:pointer;border-radius:6px;transition:all .2s}
.auth-tab.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
.auth-error{background:var(--red-dim);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:9px 12px;font-size:.72rem;color:#fca5a5;margin-bottom:14px;display:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.field input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 13px;color:var(--text);font-family:var(--font);font-size:.82rem;outline:none;transition:all .2s}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.field input::placeholder{color:var(--text3)}
.auth-btn{width:100%;padding:11px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-family:var(--font);font-weight:700;font-size:.82rem;cursor:pointer;transition:all .2s;margin-top:6px}
.auth-btn:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,0.3)}

/* HEADER */
header{flex-shrink:0;height:54px;padding:0 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:rgba(10,14,26,0.95);backdrop-filter:blur(12px);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{width:28px;height:28px;border-radius:7px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px}
.brand-name{font-size:.88rem;font-weight:800;letter-spacing:-0.02em}
.brand-name span{color:var(--blue)}
.hdr-div{width:1px;height:20px;background:var(--border2)}
.nav-pills{display:flex;gap:2px}
.nav-pill{padding:5px 12px;border-radius:7px;border:none;background:transparent;color:var(--text2);font-family:var(--font);font-weight:600;font-size:.72rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px}
.nav-pill:hover{color:var(--text);background:var(--surface2)}
.nav-pill.active{background:var(--blue-dim);color:var(--blue)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.live-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;background:var(--green-dim);border:1px solid rgba(16,185,129,0.2);font-size:.62rem;font-weight:700;color:var(--green);letter-spacing:.06em}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:livePulse 1.5s ease infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.3}}
.user-chip{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:100px;border:1px solid var(--border2);background:var(--surface)}
.user-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.65rem;color:#fff}
.user-nm{font-size:.72rem;font-weight:600;color:var(--text2)}
.logout-btn{padding:5px 11px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-family:var(--font);font-weight:600;font-size:.68rem;cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

/* LAYOUT */
#appScreen{flex:1;display:flex;overflow:hidden}
.page{flex:1;display:none;overflow:hidden}
.page.active{display:flex}

/* SIDEBAR */
.sidebar{width:256px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-sec{padding:14px 14px 12px;border-bottom:1px solid var(--border)}
.sb-sec:last-child{border-bottom:none;flex:1;overflow-y:auto}
.sec-lbl{font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode-btn{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 6px 9px;cursor:pointer;text-align:center;transition:all .2s;color:var(--text2);font-family:var(--font);font-weight:700;font-size:.67rem;position:relative;overflow:hidden}
.mode-btn:hover{border-color:var(--blue);color:var(--text);transform:translateY(-1px);background:var(--blue-dim)}
.mode-btn.active{border-color:var(--blue);background:var(--blue-dim);color:var(--blue)}
.mode-btn .mi{display:block;font-size:1.15rem;margin-bottom:5px}
.mode-btn.span2{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px}
.mode-btn.span2 .mi{font-size:.9rem;margin:0}
.topic-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--font);font-size:.75rem;outline:none;transition:all .2s}
.topic-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.topic-input::placeholder{color:var(--text3)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:.6rem;font-weight:600;padding:3px 8px;border:1px solid var(--border2);border-radius:100px;cursor:pointer;color:var(--text3);transition:all .18s;font-family:var(--font)}
.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.mode-desc{background:linear-gradient(135deg,rgba(59,130,246,0.06),rgba(139,92,246,0.04));border:1px solid rgba(59,130,246,0.15);border-radius:9px;padding:11px 12px;font-size:.7rem;color:var(--text2);line-height:1.6;margin-top:10px}
.mode-desc strong{display:block;font-size:.72rem;color:var(--blue);margin-bottom:4px;font-weight:700}
.session-list{display:flex;flex-direction:column;gap:5px}
.session-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;transition:all .18s}
.session-item:hover{border-color:var(--blue);background:var(--blue-dim)}
.si-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.si-mode{font-size:.58rem;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--blue-dim);color:var(--blue)}
.si-topic{font-size:.66rem;color:var(--text2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.si-date{font-size:.58rem;color:var(--text3)}
.no-sess{font-size:.68rem;color:var(--text3);text-align:center;padding:12px 0}

/* CHAT */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg2)}
.chat-topbar{flex-shrink:0;padding:0 20px;height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface)}
.ct-pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:livePulse 1.5s ease infinite}
.ct-mode{font-weight:700;font-size:.82rem}
.ct-sep{color:var(--text3)}
.ct-topic{font-size:.72rem;color:var(--text2)}
.ct-actions{margin-left:auto;display:flex;gap:6px}
.ct-btn{padding:6px 13px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--font);font-weight:600;font-size:.68rem;cursor:pointer;transition:all .18s}
.ct-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.ct-btn.red:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:40px;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.w-title{font-size:2rem;font-weight:800;letter-spacing:-0.04em;line-height:1.15}
.w-title span{color:var(--blue)}
.w-sub{font-size:.78rem;color:var(--text2);max-width:340px;line-height:1.75}
.w-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.w-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;text-align:left;transition:all .2s}
.w-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.wc-ic{font-size:1.2rem;margin-bottom:7px;display:block}
.wc-t{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:3px}
.wc-d{font-size:.63rem;color:var(--text2);line-height:1.55}
.msg{display:flex;flex-direction:column;gap:4px;max-width:80%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end}
.msg.ai{align-self:flex-start}
.msg-meta{display:flex;align-items:center;gap:6px}
.msg.user .msg-meta{justify-content:flex-end}
.msg-sender{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.msg-time{font-size:.55rem;color:var(--text3);font-family:var(--mono)}
.msg-bubble{padding:11px 15px;border-radius:13px;font-size:.78rem;line-height:1.75;word-break:break-word}
.msg.user .msg-bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 16px rgba(59,130,246,0.2)}
.msg.ai .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.gd-name{font-weight:800;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;margin-bottom:2px;display:block}
.gd-name.rahul{color:#f87171}
.gd-name.john{color:var(--blue)}
.gd-name.aiko{color:var(--green)}
.section-tag{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:var(--blue-dim);border-radius:4px;padding:1px 7px;margin:6px 0 2px}
.score-badge{display:inline-flex;align-items:center;background:var(--green-dim);border:1px solid rgba(16,185,129,0.3);color:var(--green);font-weight:800;font-size:.82rem;padding:3px 12px;border-radius:100px;margin:4px 0;font-family:var(--mono)}
.tts-btn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-size:.62rem;font-weight:600;cursor:pointer;transition:all .18s;font-family:var(--font)}
.tts-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.tts-btn.speaking{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.typing{display:flex;gap:5px;align-items:center;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:13px;border-bottom-left-radius:4px;width:fit-content}
.td{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:tdB 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.18s}.td:nth-child(3){animation-delay:.36s}
@keyframes tdB{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
.voice-bar{display:none;align-items:center;gap:10px;padding:9px 16px;background:rgba(239,68,68,0.06);border-top:1px solid rgba(239,68,68,0.2);font-size:.7rem;color:#fca5a5;flex-shrink:0}
.voice-bar.active{display:flex}
.vwave{display:flex;gap:3px;align-items:center}
.vwave span{width:3px;border-radius:2px;background:var(--red);animation:vw 1s ease-in-out infinite}
.vwave span:nth-child(1){height:7px}.vwave span:nth-child(2){height:13px;animation-delay:.1s}.vwave span:nth-child(3){height:18px;animation-delay:.2s}.vwave span:nth-child(4){height:13px;animation-delay:.3s}.vwave span:nth-child(5){height:7px;animation-delay:.4s}
@keyframes vw{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.7)}}
.vstop{margin-left:auto;padding:3px 10px;border-radius:5px;border:1px solid rgba(239,68,68,0.4);background:transparent;color:#fca5a5;font-size:.62rem;font-weight:600;cursor:pointer;font-family:var(--font)}
.input-bar{flex-shrink:0;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:8px;align-items:flex-end}
.input-wrap{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:11px;display:flex;align-items:flex-end;padding:3px;transition:all .2s}
.input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
#userInput{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:.78rem;resize:none;max-height:110px;min-height:38px;padding:8px 12px;line-height:1.55}
#userInput::placeholder{color:var(--text3)}
.ib-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .18s;flex-shrink:0}
.ib-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.mic-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s;flex-shrink:0}
.mic-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.mic-btn.recording{border-color:var(--red);color:var(--red);background:var(--red-dim);animation:micP .9s ease infinite}
@keyframes micP{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 7px rgba(239,68,68,0)}}
.send-btn{width:38px;height:38px;border-radius:9px;border:none;background:var(--blue);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s;flex-shrink:0;box-shadow:0 3px 12px rgba(59,130,246,0.3)}
.send-btn:hover{background:#2563eb;transform:translateY(-1px)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* SESSIONS / ANALYTICS */
.full-page{flex:1;overflow-y:auto;padding:28px;background:var(--bg2)}
.pg-hdr{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.pg-title{font-size:1.3rem;font-weight:800;letter-spacing:-0.03em}
.refresh-btn{margin-left:auto;padding:7px 14px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--font);font-weight:600;font-size:.68rem;cursor:pointer;transition:all .18s}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.sessions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px;cursor:pointer;transition:all .2s;position:relative}
.session-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 28px rgba(59,130,246,0.1)}
.sc-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sc-topic{font-weight:700;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sc-stats{display:flex;gap:12px}
.sc-stat{font-size:.65rem;color:var(--text2)}
.sc-stat b{color:var(--text);font-weight:700}
.sc-date{font-size:.6rem;color:var(--text3);margin-top:8px;font-family:var(--mono)}
.sc-del{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--text3);cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;transition:all .18s;opacity:0}
.session-card:hover .sc-del{opacity:1}
.sc-del:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px}
.empty-ic{font-size:2.5rem;margin-bottom:12px}
.empty-state p{font-size:.78rem;color:var(--text3);line-height:1.7}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:18px;position:relative;overflow:hidden;transition:all .2s}
.stat-card:hover{transform:translateY(-1px)}
.stat-card::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;opacity:.07}
.s1::after{background:var(--blue)}.s2::after{background:var(--purple)}.s3::after{background:var(--green)}.s4::after{background:var(--amber)}
.stat-val{font-size:2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:3px;font-family:var(--mono)}
.s1 .stat-val{color:var(--blue)}.s2 .stat-val{color:var(--purple)}.s3 .stat-val{color:var(--green)}.s4 .stat-val{color:var(--amber)}
.stat-lbl{font-size:.62rem;font-weight:700;letter-spacing:.07em;text-transform:uppe
